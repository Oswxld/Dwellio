name: Apply content-only route refactor

on:
  push:
    branches:
      - chatgpt/content-only-routes

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/content-only-routes

      - name: Apply refactor
        run: node scripts/apply-content-only-refactor.mjs

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make dashboard routes content-only"
          git push origin HEAD:chatgpt/content-only-routes
