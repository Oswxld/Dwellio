name: Fix billing skeleton prop

on:
  push:
    branches:
      - chatgpt/fix-billing-skeleton

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-billing-skeleton
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix billing skeleton prop
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/BillingPage.tsx')
          text = path.read_text()
          old = 'return <PageSkeleton />'
          new = 'return <PageSkeleton variant="billing" />'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one billing skeleton occurrence, found {count}.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-billing-skeleton.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/BillingPage.tsx .github/workflows/fix-billing-skeleton.yml
          git commit -m "Fix billing page skeleton variant"
          git push origin HEAD:chatgpt/fix-billing-skeleton
