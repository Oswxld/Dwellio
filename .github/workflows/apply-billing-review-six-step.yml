name: Apply billing review six-step flow

on:
  push:
    branches:
      - chatgpt/billing-review-six-step-flow

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/billing-review-six-step-flow
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python .github/scripts/patch_billing_review.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove temporary patch files
        run: |
          rm .github/workflows/apply-billing-review-six-step.yml
          rm .github/scripts/patch_billing_review.py

      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/BillingPage.tsx src/features/billing/data/billingRepository.ts .github/workflows/apply-billing-review-six-step.yml .github/scripts/patch_billing_review.py
          git commit -m "Upgrade billing draft review workflow"
          git push origin HEAD:chatgpt/billing-review-six-step-flow
