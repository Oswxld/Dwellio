name: Verify billing fix

on:
  push:
    branches:
      - chatgpt/fix-approve-all-and-reading-correction

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
