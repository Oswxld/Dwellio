name: Apply billing workflow patch

on:
  push:
    branches:
      - chatgpt/billing-workflow-readings

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/billing-workflow-readings
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch cycle creation to RPC
        run: python scripts/patch_billing_cycle_rpc.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit verified patch
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/billing/data/billingRepository.ts
          git commit -m "Use create_billing_cycle RPC"
          git push origin HEAD:chatgpt/billing-workflow-readings
