name: Apply billing workflow patch

on:
  push:
    branches:
      - chatgpt/billing-workflow-readings

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/billing-workflow-readings
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch cycle creation to RPC
        run: python scripts/patch_billing_cycle_rpc.py

      - name: Install dependencies
        run: npm ci

      - name: Build and capture output
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build-output.txt 2>&1
          status=$?
          cat build-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit patch and build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/billing/data/billingRepository.ts build-output.txt
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "Use billing cycle RPC and capture build"
            git push origin HEAD:chatgpt/billing-workflow-readings
          fi

      - name: Fail when build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
