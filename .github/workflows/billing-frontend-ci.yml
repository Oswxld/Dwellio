name: Billing frontend CI

on:
  push:
    branches:
      - chatgpt/billing-frontend
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Export package lock
        uses: actions/upload-artifact@v4
        with:
          name: router-package-lock
          path: package-lock.json
