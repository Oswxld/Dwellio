name: Verify finalized invoices step 5

on:
  push:
    branches:
      - chatgpt/finalized-invoices-step5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
