name: Apply billing error logging

on:
  push:
    branches:
      - chatgpt/billing-error-logging

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/billing-error-logging
          fetch-depth: 0

      - name: Apply refactor
        run: python scripts/add_billing_error_logging.py

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/billing/data/billingRepository.ts src/pages/BillingPage.tsx
          git commit -m "feat: log billing failures with Supabase details"
          git push origin HEAD:chatgpt/billing-error-logging
