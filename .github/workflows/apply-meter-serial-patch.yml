name: Apply meter serial number patch

on:
  push:
    branches:
      - chatgpt/meter-serial-number

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/meter-serial-number
          fetch-depth: 0

      - name: Patch meter serial generation
        run: python scripts/patch_meter_serial.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/billing/data/billingServicesRepository.ts
          git commit -m "fix: generate serial numbers for created meters"
          git push origin HEAD:chatgpt/meter-serial-number
